name: CI

on:
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build & Test (Windows, Python 3.13)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install libusb via vcpkg
        run: |
          vcpkg install libusb:x64-windows

      - name: Check C++ format (clang-format)
        shell: bash
        run: |
          find include src -type f \( -name "*.hpp" -o -name "*.cpp" \) -exec clang-format --dry-run --Werror {} +

      - name: Run clang-tidy
        shell: bash
        run: |
          files=$(find src/core src/backends -type f -name "*.cpp" 2>/dev/null || true)
          if [ -n "$files" ]; then
            clang-tidy $files -- -std=c++17 -Iinclude -Ithird_party/crazyflie_cpp/include -I"$VCPKG_INSTALLATION_ROOT/installed/x64-windows/include"
          fi

      - name: Lint and format check (Ruff)
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check .
          ruff format --check .

      - name: Install Python build tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel pytest pybind11

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build C++ core module
        run: |
          cmake --build build --config Release

      - name: Install SDK in editable mode
        env:
          CMAKE_ARGS: "-DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows"
        run: |
          pip install -e . --no-build-isolation

      - name: Run test suite
        run: |
          pytest