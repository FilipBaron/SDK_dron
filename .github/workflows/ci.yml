name: CI

on:
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build & Test (Windows, Python 3.13)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install libusb via vcpkg
        run: |
          vcpkg install libusb:x64-windows

      - name: Check C++ format (clang-format)
        shell: bash
        run: |
          clang-format --dry-run --Werror include/hal/*.hpp include/core/*.hpp include/backends/*.hpp src/core/*.cpp src/backends/*.cpp src/bindings/*.cpp

      - name: Run clang-tidy
        shell: bash
        run: |
          clang-tidy src/core/*.cpp src/backends/*.cpp -- -Iinclude -Ithird_party/crazyflie_cpp/include

      - name: Lint and format check (Ruff)
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check .
          ruff format --check .

      - name: Install Python build tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel pytest

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build C++ core module
        run: |
          cmake --build build --config Release

      - name: Install SDK in editable mode
        env:
          CMAKE_ARGS: "-DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake"
        run: |
          pip install -e . --no-build-isolation

      - name: Run test suite
        run: |
          pytest