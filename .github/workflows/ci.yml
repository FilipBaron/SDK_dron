name: CI

on:
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build & Test (Windows, Python 3.13)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check C++ format (clang-format)
        shell: bash
        run: |
          clang-format --dry-run --Werror src/bindings/*.cpp src/core/*.cpp src/core/*.hpp

      - name: Run clang-tidy
        shell: bash
        run: |
          clang-tidy src/core/*.cpp -- -Iinclude

      - name: Lint and format check (Ruff)
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check .
          ruff format --check .

      - name: Install Python build tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel pytest

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ core module
        run: |
          cmake --build build --config Release

      - name: Install SDK in editable mode
        run: |
          pip install -e . --no-build-isolation

      - name: Run test suite
        run: |
          pytest