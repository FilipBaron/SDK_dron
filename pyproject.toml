[build-system]
requires = ["scikit-build-core>=0.9.0", "pybind11>=2.12.0"]
build-backend = "scikit_build_core.build"

[project]
name = "wut_control"
version = "0.1.0"
description = "Drone SDK"
readme = "README.md"
requires-python = ">=3.10"
authors = []
dependencies = [
    "cflib>=0.1.25",
]

[tool.scikit-build]
wheel.packages = ["wut_control"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["cmake-build-debug", "build", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]